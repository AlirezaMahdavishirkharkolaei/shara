<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHIRO | Sharaf Electro Store</title>
<style>
:root{--blue:#3E4CA8;--blue-d:#2B3680;--blue-l:#E8EAF6;--bg:#F3F4F7;--panel:#fff;--text:#1D2130;--mute:#6B7080;--bot:#E6E8EE;--line:#DDE0E8;--side1:#D9DBDF;--side2:#A9ABB0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#6C7AE0;--blue-d:#4F5DC4;--blue-l:#252A4D;--bg:#12141C;--panel:#1B1E29;--text:#ECEEF5;--mute:#9AA0B4;--bot:#2A2E3C;--line:#333849;--side1:#2C2F38;--side2:#1E2028}}
:root[data-theme="dark"]{--blue:#6C7AE0;--blue-d:#4F5DC4;--blue-l:#252A4D;--bg:#12141C;--panel:#1B1E29;--text:#ECEEF5;--mute:#9AA0B4;--bot:#2A2E3C;--line:#333849;--side1:#2C2F38;--side2:#1E2028}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;height:100%;max-width:1200px;margin:0 auto;background:var(--panel);box-shadow:0 0 40px rgba(0,0,0,.08)}
aside{width:250px;flex:none;background:linear-gradient(180deg,var(--side1),var(--side2));padding:18px 14px;display:flex;flex-direction:column;gap:8px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo b{font-size:15px;color:var(--text);line-height:1.1}.logo small{display:block;color:var(--mute);font-weight:500;font-size:11px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(255,255,255,.35);color:var(--text);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.nav:hover{background:rgba(255,255,255,.55)}
.nav.primary{background:var(--blue);color:#fff;border-color:transparent}
.hist{margin-top:6px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.hist span{font-size:12px;color:var(--text);opacity:.75;padding:6px 10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:19px;color:var(--blue);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#2BB673}
header small{color:var(--mute);font-size:12px}
.grow{flex:1}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
#menu{display:none}
#msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;max-width:100%}.row.u{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;background:var(--blue-l);display:grid;place-items:center;flex:none}
.b{padding:11px 15px;border-radius:18px;max-width:min(78%,560px);line-height:1.5;font-size:15px;overflow-wrap:anywhere}
.u .b{background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.bot .b{background:var(--bot);border-bottom-left-radius:5px}
.card{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text)}
.card h4{margin:0 0 2px;font-size:14px}.card .pr{font-size:18px;font-weight:700;color:var(--blue)}
.card .ph{height:74px;border-radius:10px;background:linear-gradient(135deg,var(--blue-l),var(--bot));display:grid;place-items:center;color:var(--mute);font-size:12px;margin-bottom:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-block;text-decoration:none;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;background:var(--blue);color:#fff}
.btn.o{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:320px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--blue)}
.best{color:#1E9E62;font-weight:700}
.note{font-size:11px;color:var(--mute);margin-top:8px}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:t 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes t{50%{opacity:.25;transform:translateY(-3px)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 20px 10px}
.chip{flex:none;border:1px solid var(--blue);color:var(--blue);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.chip:hover{background:var(--blue-l)}
form{display:flex;align-items:center;gap:8px;margin:0 20px 16px;padding:8px 8px 8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
form input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15px;min-width:0}
.ic{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:18px}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--blue);color:#fff;cursor:pointer;font-size:16px}
.foot{text-align:center;font-size:11px;color:var(--mute);padding:0 20px 12px}
@media(max-width:760px){
aside{position:fixed;z-index:5;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
aside.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.35)}
#menu{display:block}.b{max-width:86%}#msgs,.chips{padding-left:14px;padding-right:14px}form{margin:0 14px 12px}}
[dir=rtl] .nav,[dir=rtl] th,[dir=rtl] td{text-align:right}
[dir=rtl] .u .b{border-bottom-right-radius:18px;border-bottom-left-radius:5px}
[dir=rtl] .bot .b{border-bottom-left-radius:18px;border-bottom-right-radius:5px}
[dir=rtl] form{padding:8px 16px 8px 8px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:18px;width:min(92vw,360px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.fld{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:13px;color:var(--mute)}
.fld input,.fld select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.hist span{cursor:pointer}.hist span:hover{opacity:1;background:rgba(255,255,255,.35)}
.u .b{unicode-bidi:plaintext}
#closeSide,#scrim{display:none}
@media(max-width:760px){
#closeSide{display:grid;place-items:center;position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:12px;width:40px;height:40px;padding:0;font-size:18px;z-index:2}
#scrim{display:block;position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.show{opacity:1;pointer-events:auto}
aside .logo{padding-inline-end:48px}}
</style>

@keyframes shxFade{from{opacity:0}}

@keyframes shxRule{from{scale:0 1}}
@keyframes shxBar{from{transform:scaleX(0)}}
@keyframes shxIris{from{clip-path:circle(150vmax at 50% 50%)}to{clip-path:circle(0 at 50% 50%)}}

#shx-intro.go .shx-shine{animation:shxShine 1.3s ease-in-out 1.6s forwards}

<script>
/* SHARAF intro controller - additive, self-contained */
(function(){
  var ONCE_PER_SESSION=false;   /* true = play only once per browser session (add ?intro=1 to the URL to force it) */
  var HOLD=4100, OUT=1000;      /* ms the intro plays before the exit iris starts / how long the exit takes */
  var d=document, root=d.documentElement, el=d.getElementById('shx-intro');
  if(!el)return;
  var reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  var force=/[?&]intro=1\b/.test(location.search);
  try{if(ONCE_PER_SESSION&&!force&&sessionStorage.getItem('shx_seen')){el.remove();return}}catch(e){}

  var T={en:['Meet SHIRO, your AI shopping assistant','Skip'],
    tr:['SHIRO ile tanışın, yapay zekâ alışveriş asistanınız','Geç'],
    fa:['با شیرو آشنا شوید، دستیار هوشمند خرید شما','رد کردن'],
    ru:['Знакомьтесь: SHIRO, ваш ИИ-помощник для покупок','Пропустить'],
    fr:['Découvrez SHIRO, votre assistant d\u2019achat IA','Passer'],
    de:['Das ist SHIRO, Ihr KI-Einkaufsassistent','Überspringen'],
    ar:['تعرّف على SHIRO، مساعد التسوّق الذكي الخاص بك','تخطّي']};
  var lang=((navigator.language||'en')+'').slice(0,2).toLowerCase(), s=T[lang]||T.en;
  el.querySelector('.shx-tag').textContent=s[0];
  var sk=el.querySelector('.shx-skip');sk.textContent=s[1];
  el.style.setProperty('--shx-t',(reduce?1.4:HOLD/1000)+'s');
  root.classList.add('shx-on');

  var done=false,started=false,tOut,raf,st=el.querySelector('.shx-stage');
  function setInert(v){try{var a=d.querySelector('.app');if(a)a.inert=v}catch(e){}}
  d.addEventListener('DOMContentLoaded',function(){if(!done)setInert(true)});

  /* floating light dust */
  var cv=el.querySelector('.shx-cv'),cx=cv.getContext&&cv.getContext('2d'),W=0,H=0,dpr=1,P=[];
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.width=Math.round(innerWidth*dpr);H=cv.height=Math.round(innerHeight*dpr)}
  function seed(){P=[];var n=Math.round(Math.min(90,innerWidth*innerHeight/14000));
    for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.3+.4)*dpr,v:(Math.random()*.28+.06)*dpr,dx:(Math.random()-.5)*.14*dpr,a:Math.random()*6.28,s:Math.random()*.02+.006,c:Math.random()<.35?'170,182,255':'214,220,240'})}
  function tick(){
    cx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var p=P[i];p.y-=p.v;p.x+=p.dx+Math.sin(p.a)*.15*dpr;p.a+=p.s;
      if(p.y<-10){p.y=H+10;p.x=Math.random()*W}
      var al=.22+.5*Math.abs(Math.sin(p.a*1.7));
      cx.fillStyle='rgba('+p.c+','+(al*.18).toFixed(3)+')';cx.beginPath();cx.arc(p.x,p.y,p.r*3.2,0,6.283);cx.fill();
      cx.fillStyle='rgba('+p.c+','+al.toFixed(3)+')';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
    raf=requestAnimationFrame(tick)}
  function onResize(){size();seed()}
  if(cx&&!reduce){size();seed();addEventListener('resize',onResize)}

  /* gentle parallax on the logo */
  function mv(e){st.style.setProperty('--px',((e.clientX/innerWidth)*2-1).toFixed(3));st.style.setProperty('--py',((e.clientY/innerHeight)*2-1).toFixed(3))}
  if(!reduce)addEventListener('pointermove',mv,{passive:true});

  function finish(){
    if(done)return;done=true;clearTimeout(tOut);
    try{sessionStorage.setItem('shx_seen','1')}catch(e){}
    el.classList.add('out');
    root.classList.remove('shx-on');root.classList.add('shx-enter');
    setTimeout(function(){
      el.remove();cancelAnimationFrame(raf);
      removeEventListener('pointermove',mv);removeEventListener('resize',onResize);removeEventListener('keydown',kd);
      setInert(false);
      try{if(matchMedia('(hover:hover)').matches&&(!d.activeElement||d.activeElement===d.body)){var i=d.getElementById('in');i&&i.focus({preventScroll:true})}}catch(e){}
    },(reduce?500:OUT)+80);
    setTimeout(function(){root.classList.remove('shx-enter')},2400);
  }
  function kd(e){if(e.key==='Escape')finish()}
  addEventListener('keydown',kd);
  sk.addEventListener('click',finish);

  function start(){
    if(started||done)return;started=true;
    el.classList.add('go');
    if(cx&&!reduce)raf=requestAnimationFrame(tick);
    tOut=setTimeout(finish,reduce?1400:HOLD);
  }
  /* wait until both logo layers are decoded so the reveal never stutters */
  try{
    var cs=getComputedStyle(el),urls=['--shx-b','--shx-g'].map(function(v){var m=cs.getPropertyValue(v).match(/url\(["']?([^"')]+)/);return m&&m[1]}).filter(Boolean);
    Promise.all(urls.map(function(u){var i=new Image();i.src=u;return i.decode?i.decode():Promise.resolve()})).then(start,start);
  }catch(e){start()}
  setTimeout(start,700);      /* fallback */
  setTimeout(finish,9000);    /* absolute failsafe: never trap the user behind the intro */
})();
</script>

<script>
/* SHARAF motion layer - purely visual helpers (ripple, sidebar spotlight, send-button state, smooth theme change) */
(function(){

    var d=document,root=d.documentElement;
    var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

      t.appendChild(s);

    },{passive:true});

    /* 2) Soft light that follows the pointer over the sidebar */
    var side=d.getElementById('side'),pend=false,lx=0,ly=0;

/* ---- text normalisation (Turkish letters, Arabic/Persian variants, ZWNJ) ---- */
const norm=s=>String(s).replace(/İ/g,"i").toLowerCase().replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").normalize("NFD").replace(/[\u0300-\u036f\u064B-\u065F\u0640\u200c\u200d]/g,"").replace(/ي|ى/g,"ی").replace(/ك/g,"ک").replace(/\s+/g," ").trim();
const esc=a=>a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

/* ---- town index ---- */
const IDX=[];
TW.forEach(r=>{const o={k:r[0],nm:r[1],s:r[2],alt:r[3]};r[4].split("|").forEach(a=>{a=norm(a);if(a)IDX.push({re:new RegExp("(?:^|[^\\p{L}\\p{N}])"+esc(a),"u"),len:a.length,o})})});
function findTown(n){let best=null;IDX.forEach(x=>{const i=n.search(x.re);if(i<0)return;if(!best||i<best.i||(i===best.i&&x.len>best.len))best={i,len:x.len,o:x.o}});return best&&best.o}

/* ---- intent: "where are your stores / nearest store" in 7 languages ---- */
const SW=/\b(stores?|branch(es)?|showrooms?|outlets?)\b|you (located|based|situated)|magaza|sube|dukkan|neredesiniz|nerdesiniz|adresiniz|شعبه|شعبات|شعب|فروشگاه|مغازه|نمایندگی|ادرستون|ادرس شما|کجایید|کجایین|کجا هستید|کجا هستین|магазин|филиал|салон|точк[аи]|где вы|где находит|magasin|boutique|succursale|agence|ou etes|vous trouv|filiale|geschaft|standort|wo sind sie|فرع|فروع|متجر|معرض|این انتم|اين انتم/u;
const AK=/\b(address|where|nearest|closest|near ?me|nearby|map|directions?|located|visit|find)\b|adres|nerede|nerde|nereden|en yakin|yakin|konum|harita|yol tarifi|bulunuyor|ادرس|کجا|نزدیک|لوکیشن|موقعیت|نقشه|مکان|адрес|где|ближайш|рядом|карт[аеуы]|добраться|находит|adresse|(^| )ou |proche|carte|situe|trouv|nachste|nahe|befindet|(^| )wo |karte|عنوان|اقرب|موقع|خریط|قریب|(^| )وین( |$)/u;
const HR=/hour|open|opening|close|saat|acik|acilis|kapan|calisma|ساعت|باز|بسته|часы|открыт|работа|heure|ouvert|horaire|offnung|offen|geoffnet|ساعات|دوام|مفتوح/u;
const ALL=/(^|\s)(all|every|alle|tous|tout|tum|tumu|hepsi|همه|تمام|все|كل|جميع)(\s|$)/u;
function intent(n,words,t){
 const S=SW.test(n),A=AK.test(n);
 if(S&&A)return true;
 if(S&&!HR.test(n)&&words<=3&&!(typeof catOf==="function"&&catOf(t)>=0))return true;
 return false}

/* ---- language of the user's message (script + common words) ---- */
const W={en:new Set("the and is are you for with what how where store stores branch branches address nearest closest near me i am in your location map find live my".split(" ")),
tr:new Set("magaza mağaza sube şube adres adresi nerede nerde yakin yakın bana benim icin için var mi mı mu mü hangi konum harita bulunuyorum yasiyorum yaşıyorum ben burada subeniz şubeniz".split(" ")),
fr:new Set("le la les des une je vous est pas pour que qui avec bonjour merci magasin adresse où ou plus proche près pres carte suis habite quel quelle comment trouver".split(" ")),
de:new Set("der die das und ich nicht ist ein eine mit für fur wo filiale adresse nächste naechste nachste karte bin wohne welche wie finde".split(" "))};
function dl(q){
 const c=r=>(q.match(r)||[]).length,arb=c(/[\u0600-\u06FF]/g),cyr=c(/[\u0400-\u04FF]/g);
 if(arb>=2&&arb>=cyr){
  const fa=c(/[پچژگ\u06A9\u06CC]/g)+c(/(می|هست|نمی|برای|چی|چه |میخوام|ممنون|سلام|کجا|کدوم|چند|را |رو |این |که |شعبه)/g),
  ar=c(/[ةيىكأإؤ]/g)+c(/(هل |ماذا|كيف|أريد|اريد|في |على |شكرا|مرحبا|أهلا|لا |فرع|فروع|أين|أقرب|عنوان)/g);
  return fa>ar?"fa":ar>fa?"ar":null}
 if(cyr>=2)return "ru";
 const w=q.toLowerCase().match(/[\p{L}'’]+/gu)||[],sc={en:0,tr:0,fr:0,de:0};
 w.forEach(x=>{for(const k in W)if(W[k].has(x))sc[k]++});
 sc.tr+=2*c(/[ışğİ]/g);sc.fr+=c(/[éèêàùâîôœ]/g);sc.de+=2*c(/[äß]/g);
 const o=Object.entries(sc).sort((a,b)=>b[1]-a[1]);return o[0][1]>0&&o[0][1]>o[1][1]?o[0][0]:null}

/* ---- builders ---- */
const enc=encodeURIComponent,digits=p=>p.replace(/[^\d+]/g,"");
const chip=(label,tok,lang)=>`<button class="chip sg" data-q="#st|${tok}|${lang}">${label}</button>`;
const mapUrl=s=>`https://maps.google.com/maps?q=${enc(s.mq)}&amp;t=m&amp;z=15&amp;ie=UTF8&amp;iwloc=&amp;output=embed`;
const openUrl=s=>`https://www.google.com/maps/search/?api=1&amp;query=${enc(s.mq)}`;
const routeUrl=s=>`https://www.google.com/maps/dir/?api=1&amp;destination=${enc(s.mq)}`;
const rows=(s,T)=>`<div class="st-row"><span><b>${T.lab[0]}:</b> <bdi dir="ltr">${s.a}</bdi></span><span><b>${T.lab[1]}:</b> <a href="tel:${digits(s.p)}"><bdi dir="ltr">${s.p}</bdi></a></span><span><b>${T.lab[2]}:</b> <bdi dir="ltr">${HRS}</bdi></span></div>`;
function storeCard(k,lang){
 const s=STORES[k],T=TT[lang];
 return `<div class="card"><h4>📍 ${s.n}</h4>${rows(s,T)}<iframe class="st-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen title="${T.mapt}: ${s.n}" src="${mapUrl(s)}"></iframe><div class="btns"><a class="btn" target="_blank" rel="noopener" href="${openUrl(s)}">${T.btn[0]}</a><a class="btn o" target="_blank" rel="noopener" href="${routeUrl(s)}">${T.btn[1]}</a><a class="btn o" href="tel:${digits(s.p)}">${T.btn[2]}</a></div></div>`}
const tail=(lang,T)=>`<div class="btns">${chip(T.ch[0],"all",lang)}${chip(T.ch[1],"ask",lang)}</div>`;
const mark=lang=>`<span data-stq="${lang}" hidden></span>`;
function askCity(lang){
 const T=TT[lang];
 return T.ask+mark(lang)+`<div class="btns">${PICK.map(k=>chip(CITY[k][lang]||CITY[k].en,"city|"+k,lang)).join("")}${chip(T.ch[0],"all",lang)}</div>`}
function unknown(lang){
 const T=TT[lang];
 return T.unk+mark(lang)+`<div class="btns">${PICK.map(k=>chip(CITY[k][lang]||CITY[k].en,"city|"+k,lang)).join("")}${chip(T.ch[0],"all",lang)}</div>`}
function answer(tw,lang){
 const T=TT[lang],s=STORES[tw.s],cl=CITY[tw.k]?(CITY[tw.k][lang]||CITY[tw.k].en):tw.nm;
 let h=T.found.replace("{c}",cl).replace("{s}",s.n)+storeCard(tw.s,lang)+`<div class="note">${T.note}</div>`;
 if(tw.alt)h+=`<div class="note">${T.also}</div><div class="btns">${chip("🗺 "+STORES[tw.alt].n,"store|"+tw.alt,lang)}</div>`;
 return h+tail(lang,T)}
function oneStore(k,lang){const T=TT[lang];return T.here.replace("{s}",STORES[k].n)+storeCard(k,lang)+tail(lang,T)}
function allStores(lang){
 const T=TT[lang];
 return T.all+`<div class="card">${ORDER.map(k=>{const s=STORES[k];return `<div class="st-it"><h4>📍 ${s.n}</h4>${rows(s,T)}<div class="btns">${chip(T.sm,"store|"+k,lang)}<a class="btn o" target="_blank" rel="noopener" href="${openUrl(s)}">${T.btn[0]}</a></div></div>`}).join("")}<div class="btns"><a class="btn o" target="_blank" rel="noopener" href="${LOC}">${T.loc}</a></div></div>`+`<div class="btns">${chip(T.ch[1],"ask",lang)}</div>`}

/* ---- is the previous bot message my "which city?" question? (survives chat restore, stays out of other chats) ---- */
function pendingLang(){
 try{const r=document.getElementById("msgs").children,k=r.length-3;
  if(k<0)return null;const e=r[k].querySelector("[data-stq]");return e?e.getAttribute("data-stq"):null}catch(e){return null}}
const wrap=(r,lang)=>(!!RTL[lang]!==!!RTL[lg])?`<div dir="${RTL[lang]?"rtl":"ltr"}">${r}</div>`:r;

function handle(q){
 /* chip tokens: #st|<action>|[key|]<lang> */
 if(q.slice(0,4)==="#st|"){
  const p=q.split("|"),lang=TT[p[p.length-1]]?p[p.length-1]:(TT[lg]?lg:"en");awaitName=false;
  let r=null;
  if(p[1]==="ask")r=askCity(lang);
  else if(p[1]==="all")r=allStores(lang);
  else if(p[1]==="store"&&STORES[p[2]])r=oneStore(p[2],lang);
  else if(p[1]==="city"){const t=TW.find(x=>x[0]===p[2]);if(t)r=answer({k:t[0],nm:t[1],s:t[2],alt:t[3]},lang)}
  return r&&wrap(r,lang)}
 if(q[0]==="#")return null;
 const mk=pendingLang(),n=norm(q),words=n?n.split(" ").length:0,lang=dl(q)||mk||(TT[lg]?lg:"en");
 const t=(typeof nz==="function"?nz(q):n)+" "+q.toLowerCase(),tw=findTown(n),it=intent(n,words,t);
 let r=null;
 if(mk){
  if(tw)r=answer(tw,lang);
  else if(it)r=askCity(lang);
  else if(ALL.test(n)&&words<=3)r=allStores(lang);
  else if(words<=3&&!(typeof catOf==="function"&&catOf(t)>=0)){
   let small=false;try{small=INT.some(i=>i.re.test(t))||SC.some(x=>x[0].test(t))||Object.values(RE).some(x=>x.test(t))}catch(e){}
   if(!small)r=unknown(lang)}}
 else if(it)r=tw?answer(tw,lang):askCity(lang);
 if(r==null)return null;
 awaitName=false;return wrap(r,lang)}

const prev=talk;
talk=function(q){try{const r=handle(q);if(r!=null)return r}catch(err){console.error("store-locator:",err)}return prev(q)};
}catch(err){console.error("store-locator layer failed to load:",err)}
})();
